<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>就活 Agent</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@300;400;500;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161920;
    --surface2: #1e222c;
    --border: rgba(255,255,255,0.07);
    --border2: rgba(255,255,255,0.13);
    --accent: #6ee7b7;
    --accent2: #34d399;
    --accent-dim: rgba(110,231,183,0.12);
    --text: #e8eaf0;
    --text2: #8b909e;
    --text3: #555b6b;
    --red: #f87171;
    --amber: #fbbf24;
    --blue: #60a5fa;
    --purple: #a78bfa;
    --font: 'Noto Sans JP', sans-serif;
    --mono: 'DM Mono', monospace;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font);
    font-size: 14px;
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ── Header ── */
  header {
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    flex-shrink: 0;
  }
  .logo { font-size: 18px; font-weight: 700; color: var(--accent); letter-spacing: -0.5px; }
  .logo span { color: var(--text2); font-weight: 300; }
  header nav { margin-left: auto; display: flex; gap: 4px; }
  header nav button {
    background: none; border: none; color: var(--text2); font-family: var(--font);
    font-size: 13px; padding: 6px 14px; border-radius: 6px; cursor: pointer;
    transition: all 0.15s;
  }
  header nav button:hover { background: var(--surface2); color: var(--text); }
  header nav button.active { background: var(--accent-dim); color: var(--accent); }

  /* ── Setup banner ── */
  #setup-banner {
    background: rgba(251,191,36,0.08);
    border-bottom: 1px solid rgba(251,191,36,0.2);
    padding: 10px 24px;
    display: flex; align-items: center; gap: 10px;
    font-size: 13px; color: var(--amber); flex-shrink: 0;
  }
  #setup-banner a { color: var(--amber); text-decoration: underline; cursor: pointer; }
  #setup-banner .dismiss { margin-left: auto; cursor: pointer; opacity: 0.6; }

  /* ── Main layout ── */
  main { flex: 1; display: flex; overflow: hidden; position: relative; }

  /* ── View panels ── */
  .view-panel { display: none; flex: 1; overflow: hidden; }
  .view-panel.active { display: flex; }

  /* ── Chat panel ── */
  #chat-view { flex-direction: row; }
  #chat-panel {
    flex: 1; display: flex; flex-direction: column;
    border-right: 1px solid var(--border); min-width: 0;
  }
  #messages {
    flex: 1; overflow-y: auto; padding: 24px;
    display: flex; flex-direction: column; gap: 16px; scroll-behavior: smooth;
  }
  #messages::-webkit-scrollbar { width: 4px; }
  #messages::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 2px; }
  .msg { display: flex; gap: 10px; max-width: 80%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .msg.assistant { align-self: flex-start; }
  .avatar {
    width: 28px; height: 28px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    font-size: 12px; font-weight: 700; flex-shrink: 0;
  }
  .msg.assistant .avatar { background: var(--accent-dim); color: var(--accent); }
  .msg.user .avatar { background: var(--surface2); color: var(--text2); }
  .bubble { padding: 10px 14px; border-radius: 12px; line-height: 1.6; font-size: 13.5px; }
  .msg.assistant .bubble { background: var(--surface2); border: 1px solid var(--border); border-top-left-radius: 4px; color: var(--text); }
  .msg.user .bubble { background: var(--accent-dim); border: 1px solid rgba(110,231,183,0.2); border-top-right-radius: 4px; color: var(--text); }
  .event-card { margin-top: 10px; background: var(--surface); border: 1px solid var(--border2); border-left: 3px solid var(--accent); border-radius: 8px; padding: 10px 14px; font-size: 13px; }
  .event-card .ev-company { font-weight: 700; color: var(--accent); }
  .event-card .ev-meta { color: var(--text2); margin-top: 4px; font-size: 12px; font-family: var(--mono); }
  .event-card .ev-actions { display: flex; gap: 6px; margin-top: 8px; }
  .ev-btn { font-size: 12px; padding: 4px 12px; border-radius: 5px; cursor: pointer; border: 1px solid; font-family: var(--font); transition: all 0.15s; }
  .ev-btn.confirm { border-color: var(--accent); color: var(--accent); background: var(--accent-dim); }
  .ev-btn.confirm:hover { background: rgba(110,231,183,0.2); }
  .ev-btn.cancel { border-color: var(--border2); color: var(--text2); background: none; }
  .ev-btn.cancel:hover { background: var(--surface2); }
  #input-area { padding: 16px 24px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; flex-shrink: 0; }
  #user-input {
    flex: 1; background: var(--surface2); border: 1px solid var(--border2);
    border-radius: 10px; padding: 10px 14px; color: var(--text);
    font-family: var(--font); font-size: 14px; resize: none; min-height: 42px; max-height: 120px;
    outline: none; transition: border-color 0.15s; line-height: 1.5;
  }
  #user-input:focus { border-color: rgba(110,231,183,0.4); }
  #user-input::placeholder { color: var(--text3); }
  #send-btn {
    width: 42px; height: 42px; border-radius: 10px; border: none;
    background: var(--accent); color: #0d0f14; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; transition: all 0.15s; flex-shrink: 0;
  }
  #send-btn:hover { background: var(--accent2); }
  #send-btn:disabled { background: var(--surface2); color: var(--text3); cursor: not-allowed; }

  /* ── Sidebar ── */
  #sidebar { width: 300px; flex-shrink: 0; display: flex; flex-direction: column; overflow: hidden; }
  #sidebar-header { padding: 16px 20px 12px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  #sidebar-header h2 { font-size: 13px; font-weight: 500; color: var(--text2); letter-spacing: 0.5px; }
  .filter-tabs { display: flex; gap: 4px; }
  .ftab { font-size: 11px; padding: 3px 10px; border-radius: 5px; cursor: pointer; border: 1px solid var(--border2); background: none; color: var(--text2); font-family: var(--font); transition: all 0.15s; }
  .ftab.active { background: var(--accent-dim); border-color: rgba(110,231,183,0.3); color: var(--accent); }
  #events-list { flex: 1; overflow-y: auto; padding: 12px 16px; display: flex; flex-direction: column; gap: 8px; }
  #events-list::-webkit-scrollbar { width: 3px; }
  #events-list::-webkit-scrollbar-thumb { background: var(--border); }
  .event-item { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; cursor: pointer; transition: all 0.15s; }
  .event-item:hover { border-color: var(--border2); background: var(--surface2); }
  .event-item.urgent { border-left: 2px solid var(--red); }
  .event-item.soon { border-left: 2px solid var(--amber); }
  .event-item.ok { border-left: 2px solid var(--accent); }
  .event-item.done { opacity: 0.45; }
  .ei-top { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
  .ei-company { font-size: 13px; font-weight: 500; }
  .type-badge { font-size: 10px; padding: 1px 7px; border-radius: 4px; font-weight: 500; }
  .type-面接 { background: rgba(167,139,250,0.15); color: var(--purple); }
  .type-ES { background: rgba(96,165,250,0.15); color: var(--blue); }
  .type-説明会 { background: rgba(110,231,183,0.12); color: var(--accent); }
  .type-筆記 { background: rgba(251,191,36,0.12); color: var(--amber); }
  .type-その他 { background: rgba(139,144,158,0.15); color: var(--text2); }
  .ei-time { font-size: 11px; color: var(--text2); font-family: var(--mono); }
  .ei-countdown { font-size: 10px; margin-top: 2px; }
  .urgent-text { color: var(--red); }
  .soon-text { color: var(--amber); }
  .ok-text { color: var(--text2); }
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text3); font-size: 13px; }
  .empty-icon { font-size: 32px; margin-bottom: 12px; }
  .thinking { display: flex; gap: 4px; padding: 8px 0; }
  .thinking span { width: 6px; height: 6px; border-radius: 50%; background: var(--text3); animation: bounce 1.2s infinite; }
  .thinking span:nth-child(2) { animation-delay: 0.2s; }
  .thinking span:nth-child(3) { animation-delay: 0.4s; }
  @keyframes bounce { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-6px); } }

  /* ── Calendar view ── */
  #calendar-view { flex-direction: column; }
  .cal-header { padding: 16px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
  .cal-header h2 { font-size: 15px; font-weight: 500; flex: 1; }
  .cal-nav { background: none; border: 1px solid var(--border2); color: var(--text2); width: 30px; height: 30px; border-radius: 6px; cursor: pointer; font-size: 14px; }
  .cal-nav:hover { background: var(--surface2); color: var(--text); }
  .cal-body { flex: 1; overflow-y: auto; padding: 16px 24px; }
  .cal-weekdays { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; }
  .cal-weekday { text-align: center; font-size: 11px; color: var(--text3); padding: 4px; font-weight: 500; letter-spacing: 0.5px; }
  .cal-days { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
  .cal-day { min-height: 90px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 6px; }
  .cal-day.other-month { opacity: 0.25; }
  .cal-day.today { border-color: var(--accent); }
  .cal-day-num { font-size: 12px; font-weight: 500; margin-bottom: 4px; color: var(--text2); }
  .cal-day.today .cal-day-num { color: var(--accent); }
  .cal-dot { font-size: 10px; padding: 2px 5px; border-radius: 3px; margin-bottom: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cal-dot.type-面接 { background: rgba(167,139,250,0.2); color: var(--purple); }
  .cal-dot.type-ES { background: rgba(96,165,250,0.2); color: var(--blue); }
  .cal-dot.type-説明会 { background: rgba(110,231,183,0.15); color: var(--accent); }
  .cal-dot.type-筆記 { background: rgba(251,191,36,0.15); color: var(--amber); }
  .cal-dot.type-その他 { background: rgba(139,144,158,0.15); color: var(--text2); }

  /* ── Memo view ── */
  #memo-view { flex-direction: row; }
  #memo-list { width: 260px; flex-shrink: 0; border-right: 1px solid var(--border); display: flex; flex-direction: column; }
  #memo-list-header { padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  #memo-list-header h2 { font-size: 13px; font-weight: 500; color: var(--text2); }
  .new-memo-btn { background: var(--accent-dim); border: 1px solid rgba(110,231,183,0.3); color: var(--accent); border-radius: 6px; padding: 4px 10px; font-size: 12px; cursor: pointer; font-family: var(--font); }
  .new-memo-btn:hover { background: rgba(110,231,183,0.2); }
  #memo-items { flex: 1; overflow-y: auto; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
  .memo-item { padding: 10px 12px; border-radius: 7px; cursor: pointer; border: 1px solid transparent; transition: all 0.15s; }
  .memo-item:hover { background: var(--surface2); }
  .memo-item.active { background: var(--surface2); border-color: var(--border2); }
  .memo-item-title { font-size: 13px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .memo-item-date { font-size: 11px; color: var(--text3); margin-top: 2px; font-family: var(--mono); }
  .memo-item-preview { font-size: 11px; color: var(--text2); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #memo-editor { flex: 1; display: flex; flex-direction: column; }
  #memo-toolbar { padding: 12px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
  #memo-title-input { flex: 1; background: none; border: none; color: var(--text); font-family: var(--font); font-size: 15px; font-weight: 500; outline: none; }
  #memo-title-input::placeholder { color: var(--text3); }
  .memo-tag { font-size: 11px; padding: 2px 8px; border-radius: 4px; cursor: pointer; border: 1px solid var(--border2); color: var(--text2); background: none; font-family: var(--font); }
  .memo-tag.active { background: var(--accent-dim); border-color: rgba(110,231,183,0.3); color: var(--accent); }
  #delete-memo-btn { background: none; border: none; color: var(--text3); cursor: pointer; font-size: 16px; padding: 4px; border-radius: 4px; }
  #delete-memo-btn:hover { color: var(--red); background: rgba(248,113,113,0.1); }
  #memo-content { flex: 1; background: none; border: none; color: var(--text); font-family: var(--font); font-size: 14px; line-height: 1.8; padding: 20px 24px; resize: none; outline: none; }
  #memo-content::placeholder { color: var(--text3); }
  #memo-empty { flex: 1; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 12px; color: var(--text3); font-size: 13px; }

  /* ── Settings modal ── */
  .detail-modal { display: none !important; }
  .detail-modal.open { display: flex !important; }

  /* ── Board view ── */
  #board-view { flex-direction: column; overflow: hidden; }
  .board-container { flex: 1; display: flex; gap: 12px; padding: 20px; overflow-x: auto; align-items: flex-start; }
  .board-column { flex: 0 0 220px; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; display: flex; flex-direction: column; max-height: 100%; }
  .board-col-header { padding: 12px 14px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; flex-shrink: 0; }
  .board-col-title { font-size: 13px; font-weight: 500; }
  .board-col-count { font-size: 11px; color: var(--text3); background: var(--surface2); padding: 1px 8px; border-radius: 10px; }
  .board-col-body { flex: 1; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 8px; min-height: 60px; }
  .board-col-body.drag-over { background: var(--accent-dim); }
  .board-card { background: var(--surface2); border: 1px solid var(--border2); border-radius: 8px; padding: 10px 12px; cursor: grab; transition: all 0.15s; }
  .board-card:hover { border-color: rgba(110,231,183,0.3); }
  .board-card:active { cursor: grabbing; }
  .board-card.dragging { opacity: 0.4; }
  .board-card-company { font-size: 13px; font-weight: 600; margin-bottom: 4px; }
  .board-card-meta { font-size: 11px; color: var(--text2); font-family: var(--mono); }
  .board-add { padding: 12px; }
  .board-add input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 7px; padding: 8px 10px; color: var(--text); font-family: var(--font); font-size: 12px; outline: none; }
  .board-add input:focus { border-color: rgba(110,231,183,0.4); }
  #settings-modal { position: fixed; inset: 0; background: rgba(0,0,0,0.6); display: none; align-items: center; justify-content: center; z-index: 100; }
  #settings-modal.open { display: flex; }
  .modal-box { background: var(--surface); border: 1px solid var(--border2); border-radius: 14px; padding: 28px; width: 480px; max-width: 95vw; max-height: 90vh; overflow-y: auto; }
  .modal-box h3 { font-size: 16px; margin-bottom: 20px; }
  .field { margin-bottom: 16px; }
  .field label { display: block; font-size: 12px; color: var(--text2); margin-bottom: 6px; letter-spacing: 0.3px; }
  .field input { width: 100%; background: var(--surface2); border: 1px solid var(--border2); border-radius: 7px; padding: 9px 12px; color: var(--text); font-family: var(--mono); font-size: 13px; outline: none; }
  .field input:focus { border-color: rgba(110,231,183,0.4); }
  .modal-actions { display: flex; gap: 8px; margin-top: 20px; }
  .btn-primary { flex: 1; padding: 10px; border-radius: 8px; border: none; background: var(--accent); color: #0d0f14; font-family: var(--font); font-size: 14px; font-weight: 700; cursor: pointer; transition: background 0.15s; }
  .btn-primary:hover { background: var(--accent2); }
  .btn-secondary { padding: 10px 20px; border-radius: 8px; border: 1px solid var(--border2); background: none; color: var(--text2); font-family: var(--font); font-size: 14px; cursor: pointer; }
  .or-divider { text-align: center; color: var(--text3); font-size: 12px; margin: 12px 0; }
  .hint { font-size: 11px; color: var(--text3); margin-top: 4px; line-height: 1.5; }
  a.link { color: var(--accent); text-decoration: none; }
  a.link:hover { text-decoration: underline; }
</style>
</head>
<body>

<header>
  <div class="logo">就活<span>Agent</span></div>
  <nav>
    <button class="active" onclick="showView('chat', this)">💬 チャット</button>
    <button onclick="showView('calendar', this)">📅 カレンダー</button>
    <button onclick="showView('memo', this)">📝 メモ</button>
    <button onclick="showView('board', this)">📊 進捗</button>
    <button onclick="openSettings()">⚙️ 設定</button>
  </nav>
</header>

<div id="setup-banner">
  ⚠️ まずは <a onclick="openSettings()">設定</a> で Groq API キーを入力してください
  <span class="dismiss" onclick="this.parentElement.style.display='none'">✕</span>
</div>

<main>
  <!-- ── Chat View ── -->
  <div id="chat-view" class="view-panel active">
    <div id="chat-panel">
      <div id="messages">
        <div class="msg assistant">
          <div class="avatar">AI</div>
          <div class="bubble">
            こんにちは！就活の日程管理をお手伝いします。<br><br>
            こんな感じで話しかけてください：<br>
            ・「明日15時にトヨタの面接がある」<br>
            ・「ソニーのES締め切りは来週金曜」<br>
            ・「今週の予定を見せて」<br>
            ・「メルカリの面接を完了にして」
          </div>
        </div>
      </div>
      <div id="input-area">
        <textarea id="user-input" placeholder="日程や予定を話しかけてください..." rows="1"
          onkeydown="handleKey(event)" oninput="autoResize(this)"></textarea>
        <button id="send-btn" onclick="sendMessage()">↑</button>
      </div>
    </div>
    <div id="sidebar">
      <div id="sidebar-header">
        <h2>日程一覧</h2>
        <div class="filter-tabs">
          <button class="ftab active" onclick="filterEvents('all', this)">全て</button>
          <button class="ftab" onclick="filterEvents('upcoming', this)">近い</button>
          <button class="ftab" onclick="filterEvents('done', this)">完了</button>
        </div>
      </div>
      <div id="events-list">
        <div class="empty-state"><div class="empty-icon">📭</div>予定がまだありません</div>
      </div>
    </div>
  </div>

  <!-- ── Calendar View ── -->
  <div id="calendar-view" class="view-panel">
    <div class="cal-header">
      <button class="cal-nav" onclick="changeMonth(-1)">←</button>
      <h2 id="cal-title"></h2>
      <button class="cal-nav" onclick="changeMonth(1)">→</button>
    </div>
    <div class="cal-body">
      <div class="cal-weekdays">
        <div class="cal-weekday">日</div><div class="cal-weekday">月</div>
        <div class="cal-weekday">火</div><div class="cal-weekday">水</div>
        <div class="cal-weekday">木</div><div class="cal-weekday">金</div>
        <div class="cal-weekday">土</div>
      </div>
      <div class="cal-days" id="cal-days"></div>
    </div>
  </div>

  <!-- ── Memo View ── -->
  <div id="memo-view" class="view-panel">
    <div id="memo-list">
      <div id="memo-list-header">
        <h2>メモ一覧</h2>
        <button class="new-memo-btn" onclick="newMemo()">＋ 新規</button>
      </div>
      <div id="memo-items"></div>
    </div>
    <div id="memo-editor">
      <div id="memo-empty">
        <div style="font-size:32px">📝</div>
        メモを選択するか新規作成してください
      </div>
      <div id="memo-edit-area" style="display:none; flex:1; flex-direction:column;">
        <div id="memo-toolbar">
          <input type="text" id="memo-title-input" placeholder="タイトル..." oninput="saveMemo()">
          <select id="memo-company-tag" onchange="saveMemo()" style="background:var(--surface2);border:1px solid var(--border2);color:var(--text2);border-radius:5px;padding:3px 8px;font-size:11px;font-family:var(--font);outline:none;">
            <option value="">会社タグなし</option>
          </select>
          <button id="delete-memo-btn" onclick="deleteMemo()" title="削除">🗑</button>
        </div>
        <textarea id="memo-content" placeholder="ここにメモを入力..." oninput="saveMemo()"></textarea>
      </div>
    </div>
  </div>

  <!-- ── Board View ── -->
  <div id="board-view" class="view-panel">
    <div class="board-container" id="board-container"></div>
  </div>
</main>

<!-- Event Detail Modal -->
<div id="event-detail-modal" style="position:fixed;inset:0;background:rgba(0,0,0,0.6);display:none;align-items:center;justify-content:center;z-index:100;" class="detail-modal">
  <div style="background:var(--surface);border:1px solid var(--border2);border-radius:14px;padding:28px;width:480px;max-width:95vw;max-height:90vh;overflow-y:auto;">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;">
      <span id="detail-company" style="font-size:18px;font-weight:700;color:var(--accent)"></span>
      <span id="detail-type" class="type-badge"></span>
      <span id="detail-status" style="margin-left:auto;font-size:12px;"></span>
    </div>
    <div style="font-size:13px;color:var(--text2);font-family:var(--mono);margin-bottom:20px;">📅 <span id="detail-time"></span></div>
    <div style="margin-bottom:16px;">
      <label style="display:block;font-size:12px;color:var(--text2);margin-bottom:6px;letter-spacing:0.3px;">一言メモ</label>
      <input type="text" id="detail-note" placeholder="簡単なメモ..." style="width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:9px 12px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;"/>
    </div>
    <div style="margin-bottom:20px;">
      <label style="display:block;font-size:12px;color:var(--text2);margin-bottom:6px;letter-spacing:0.3px;">詳細メモ（面接の質問、準備事項など）</label>
      <textarea id="detail-detail" placeholder="面接の質問メモ、準備リスト、感想など..." style="width:100%;background:var(--surface2);border:1px solid var(--border2);border-radius:7px;padding:9px 12px;color:var(--text);font-family:var(--font);font-size:13px;outline:none;resize:vertical;min-height:120px;line-height:1.6;"></textarea>
    </div>
    <div style="display:flex;gap:8px;">
      <button onclick="closeEventDetail()" style="padding:10px 20px;border-radius:8px;border:1px solid var(--border2);background:none;color:var(--text2);font-family:var(--font);font-size:14px;cursor:pointer;">キャンセル</button>
      <button id="detail-done-btn" onclick="markDoneFromDetail()" style="padding:10px 20px;border-radius:8px;border:1px solid var(--border2);background:none;color:var(--amber);font-family:var(--font);font-size:14px;cursor:pointer;">✓ 完了にする</button>
      <button onclick="saveEventDetail()" style="flex:1;padding:10px;border-radius:8px;border:none;background:var(--accent);color:#0d0f14;font-family:var(--font);font-size:14px;font-weight:700;cursor:pointer;">保存</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div id="settings-modal">
  <div class="modal-box">
    <h3>⚙️ 設定</h3>
    <div class="field">
      <label>GROQ API KEY</label>
      <input type="password" id="groq-key-input" placeholder="gsk_..." />
      <div class="hint"><a class="link" href="https://console.groq.com/keys" target="_blank">console.groq.com/keys</a> で無料で取得できます。</div>
    </div>
    <div class="field">
      <label>GOOGLE CALENDAR 連携</label>
      <button onclick="startGoogleLogin()" style="width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:10px 16px;background:var(--surface2);border:1px solid var(--border2);border-radius:8px;color:var(--text);font-family:var(--font);font-size:14px;cursor:pointer;transition:all 0.15s;" onmouseover="this.style.borderColor='rgba(110,231,183,0.4)'" onmouseout="this.style.borderColor='var(--border2)'">
        <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
        Google アカウントで連携する
      </button>
      <div id="gcal-status" style="margin-top:8px;font-size:12px;color:var(--text2);text-align:center;"></div>
      <div class="hint" style="margin-top:8px;">一度認証すれば、トークンは自動的に更新されます。</div>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeSettings()">キャンセル</button>
      <button class="btn-primary" onclick="saveSettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ─── State ───────────────────────────────────────────────
let events = JSON.parse(localStorage.getItem('shukatsu_events') || '[]');
let memos = JSON.parse(localStorage.getItem('shukatsu_memos') || '[]');
let messages = [];
let settings = JSON.parse(localStorage.getItem('shukatsu_settings') || '{}');
let currentFilter = 'all';
let currentMemoId = null;
let companies = JSON.parse(localStorage.getItem('shukatsu_companies') || '[]');
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

// ─── Init ────────────────────────────────────────────────
if (settings.groqKey) document.getElementById('setup-banner').style.display = 'none';
renderEvents();
renderMemoList();

// ─── View switching ───────────────────────────────────────
function showView(v, btn) {
  document.querySelectorAll('.view-panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('header nav button').forEach(b => b.classList.remove('active'));
  document.getElementById(v + '-view').classList.add('active');
  if (btn) btn.classList.add('active');
  if (v === 'calendar') renderCalendar();
  if (v === 'memo') renderMemoList();
  if (v === 'board') renderBoard();
}

// ─── Settings ────────────────────────────────────────────
function openSettings() {
  document.getElementById('groq-key-input').value = settings.groqKey || '';
  const status = document.getElementById('gcal-status');
  if (settings.gcalToken) {
    status.textContent = '✅ Google Calendar 連携済み';
    status.style.color = 'var(--accent)';
  } else {
    status.textContent = '未連携';
    status.style.color = 'var(--text2)';
  }
  document.getElementById('settings-modal').classList.add('open');
}
function closeSettings() {
  document.getElementById('settings-modal').classList.remove('open');
}
function saveSettings() {
  settings.groqKey = document.getElementById('groq-key-input').value.trim();
  localStorage.setItem('shukatsu_settings', JSON.stringify(settings));
  if (settings.groqKey) document.getElementById('setup-banner').style.display = 'none';
  closeSettings();
  addMessage('assistant', '✅ 設定を保存しました！');
}

function startGoogleLogin() {
  const clientId = '895685968249-4s1jgg2n0nmisapeql898ug5uk8nv8uh.apps.googleusercontent.com';
  const redirectUri = encodeURIComponent('https://shukatsu-agent-nine.vercel.app/api/callback');
  const scope = encodeURIComponent('https://www.googleapis.com/auth/calendar.events');
  const url = `https://accounts.google.com/o/oauth2/v2/auth?client_id=${clientId}&redirect_uri=${redirectUri}&response_type=code&scope=${scope}&access_type=offline&prompt=consent`;
  const popup = window.open(url, 'google-auth', 'width=500,height=600');
  window.addEventListener('message', function handler(e) {
    if (e.data?.type === 'GOOGLE_AUTH_SUCCESS') {
      settings.gcalToken = e.data.tokens.access_token;
      settings.gcalRefreshToken = e.data.tokens.refresh_token;
      localStorage.setItem('shukatsu_settings', JSON.stringify(settings));
      window.removeEventListener('message', handler);
      const status = document.getElementById('gcal-status');
      if (status) { status.textContent = '✅ 連携完了！'; status.style.color = 'var(--accent)'; }
      addMessage('assistant', '✅ Google Calendar の連携が完了しました！これで予定を自動でカレンダーに追加できます。');
    }
  });
}

// ─── UI helpers ──────────────────────────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 120) + 'px';
}
function handleKey(e) {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
}

// ─── Message rendering ────────────────────────────────────
function addMessage(role, text, eventData) {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = `msg ${role}`;
  const label = role === 'assistant' ? 'AI' : 'あ';
  let content = `<div class="avatar">${label}</div><div class="bubble">`;
  content += text.replace(/\n/g, '<br>');
  if (eventData) content += renderEventCard(eventData);
  content += '</div>';
  div.innerHTML = content;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
  return div;
}
function renderEventCard(ev) {
  const typeClass = `type-${ev.type || 'その他'}`;
  return `<div class="event-card">
    <div><span class="ev-company">${ev.company}</span>
    <span class="type-badge ${typeClass}" style="margin-left:6px">${ev.type || 'その他'}</span></div>
    <div class="ev-meta">📅 ${formatDatetime(ev.datetime)}</div>
    ${ev.note ? `<div class="ev-meta">📝 ${ev.note}</div>` : ''}
    <div class="ev-actions">
      <button class="ev-btn confirm" onclick='confirmEvent(${JSON.stringify(ev).replace(/'/g,"&#39;")})'>✓ 登録する</button>
      <button class="ev-btn cancel" onclick="this.closest('.event-card').remove()">✕ キャンセル</button>
    </div>
  </div>`;
}
function showThinking() {
  const container = document.getElementById('messages');
  const div = document.createElement('div');
  div.className = 'msg assistant'; div.id = 'thinking-indicator';
  div.innerHTML = `<div class="avatar">AI</div><div class="bubble"><div class="thinking"><span></span><span></span><span></span></div></div>`;
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;
}
function hideThinking() {
  const el = document.getElementById('thinking-indicator');
  if (el) el.remove();
}

// ─── Send message ─────────────────────────────────────────
async function sendMessage() {
  const input = document.getElementById('user-input');
  const text = input.value.trim();
  if (!text) return;
  addMessage('user', text);
  input.value = ''; input.style.height = 'auto';
  document.getElementById('send-btn').disabled = true;
  messages.push({ role: 'user', content: text });
  if (!settings.groqKey) {
    addMessage('assistant', '⚠️ まず設定画面で Groq API キーを入力してください（右上の ⚙️ 設定）');
    document.getElementById('send-btn').disabled = false;
    return;
  }
  showThinking();
  try {
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${settings.groqKey}` },
      body: JSON.stringify({
        model: 'llama-3.3-70b-versatile',
        max_tokens: 1000,
        messages: [{ role: 'system', content: buildSystemPrompt() }, ...messages]
      })
    });
    const data = await res.json();
    hideThinking();
    if (data.error) {
      addMessage('assistant', `❌ APIエラー: ${data.error.message}`);
      messages.pop(); document.getElementById('send-btn').disabled = false; return;
    }
    const reply = data.choices?.[0]?.message?.content || '（応答なし）';
    messages.push({ role: 'assistant', content: reply });

    const foundEvents = extractEvents(reply);
    let visibleText = reply.replace(/```json[\s\S]*?```/g, '').trim();
    visibleText = visibleText.replace(/\{[\s\S]*?"company"[\s\S]*?\}/g, '').trim();

    if (foundEvents.length > 0) {
      addMessage('assistant', visibleText || '以下の予定を登録しますか？');
      const lb = document.querySelector('#messages .msg.assistant:last-child .bubble');
      foundEvents.forEach(e => {
        if (lb) { const d = document.createElement('div'); d.innerHTML = renderEventCard(e); lb.appendChild(d.firstChild); }
      });
    } else {
      addMessage('assistant', reply);
    }
  } catch (e) {
    hideThinking();
    addMessage('assistant', `❌ 接続エラー: ${e.message}`);
    messages.pop();
  }
  document.getElementById('send-btn').disabled = false;
}

function extractEvents(text) {
  const results = [];
  const seen = new Set();
  const objRegex = /\{[^{}]*"company"[^{}]*\}/g;
  let m;
  while ((m = objRegex.exec(text)) !== null) {
    try {
      const obj = JSON.parse(m[0]);
      if (obj.company && obj.datetime) {
        const key = obj.company + obj.datetime;
        if (!seen.has(key)) { seen.add(key); results.push(obj); }
      }
    } catch {}
  }
  return results;
}

function buildSystemPrompt() {
  const evList = events.map(e => `[${e.id}] ${e.company} / ${e.type} / ${formatDatetime(e.datetime)} / ${e.status}`).join('\n') || 'なし';
  return `あなたは就職活動の日程管理AIです。今日: ${new Date().toLocaleString('ja-JP')}
登録済み予定:\n${evList}

新しい予定を検出したら、必ず以下のルールを守ること:
1. JSONは必ず \`\`\`json と \`\`\` で囲むこと。生のJSONだけを返すことは絶対禁止。
2. 形式:
\`\`\`json
{"company":"会社名","type":"面接|ES|説明会|筆記|その他","datetime":"YYYY-MM-DDTHH:mm:ss","note":"メモ","reminders":[1440,60]}
\`\`\`
3. 日時が不明な場合は確認する。
4. 一覧を聞かれたら見やすく教える。
5. 簡潔に返答する。`;
}

// ─── Event management ─────────────────────────────────────
async function confirmEvent(ev) {
  ev.id = Date.now(); ev.status = 'pending'; ev.createdAt = new Date().toISOString();
  events.push(ev); saveEvents(); renderEvents();
  addMessage('assistant', `✅ ${ev.company} の ${ev.type} を登録しました！\n${formatDatetime(ev.datetime)}`);
  if (settings.gcalToken) await addToGoogleCalendar(ev);
}
async function addToGoogleCalendar(ev) {
  const start = new Date(ev.datetime);
  const end = new Date(start.getTime() + 60*60*1000);
  const body = {
    summary: `【就活】${ev.company} ${ev.type}`,
    description: ev.note || '',
    start: { dateTime: start.toISOString(), timeZone: 'Asia/Tokyo' },
    end: { dateTime: end.toISOString(), timeZone: 'Asia/Tokyo' },
    reminders: { useDefault: false, overrides: (ev.reminders||[60,1440]).map(m=>({method:'popup',minutes:m})) }
  };
  try {
    const res = await fetch('https://www.googleapis.com/calendar/v3/calendars/primary/events', {
      method: 'POST',
      headers: { 'Authorization': `Bearer ${settings.gcalToken}`, 'Content-Type': 'application/json' },
      body: JSON.stringify(body)
    });
    const data = await res.json();
    if (data.id) addMessage('assistant', `📅 Google Calendar にも追加しました！`);
    else addMessage('assistant', `⚠️ Calendar への追加に失敗: ${data.error?.message}`);
  } catch(e) { addMessage('assistant', `⚠️ Calendar API エラー: ${e.message}`); }
}
function saveEvents() { localStorage.setItem('shukatsu_events', JSON.stringify(events)); }
function filterEvents(f, btn) {
  currentFilter = f;
  document.querySelectorAll('.ftab').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
  renderEvents();
}
function renderEvents() {
  const container = document.getElementById('events-list');
  const now = new Date();
  let filtered = events.filter(ev => {
    if (currentFilter === 'done') return ev.status === 'done';
    if (currentFilter === 'upcoming') { const diff=(new Date(ev.datetime)-now)/86400000; return ev.status!=='done'&&diff<=7; }
    return ev.status !== 'done';
  }).sort((a,b) => new Date(a.datetime)-new Date(b.datetime));
  if (!filtered.length) { container.innerHTML=`<div class="empty-state"><div class="empty-icon">${currentFilter==='done'?'✅':'📭'}</div>${currentFilter==='done'?'完了した予定はありません':'予定がありません'}</div>`; return; }
  container.innerHTML = filtered.map(ev => {
    const diff = (new Date(ev.datetime)-now)/86400000;
    let urgency='ok', countdown='';
    if (ev.status==='done') urgency='done';
    else if (diff<1) { urgency='urgent'; countdown=`<div class="ei-countdown urgent-text">⚠️ 今日！</div>`; }
    else if (diff<3) { urgency='soon'; countdown=`<div class="ei-countdown soon-text">⏰ あと${Math.ceil(diff)}日</div>`; }
    else countdown=`<div class="ei-countdown ok-text">あと${Math.ceil(diff)}日</div>`;
    const hasDetail = ev.note || ev.detail;
    return `<div class="event-item ${urgency}" onclick="openEventDetail(${ev.id})">
      <div class="ei-top"><span class="ei-company">${ev.company}</span><span class="type-badge type-${ev.type||'その他'}">${ev.type||'その他'}</span>${hasDetail?'<span style="font-size:10px;color:var(--text3);margin-left:auto">📝</span>':''}</div>
      <div class="ei-time">${formatDatetime(ev.datetime)}</div>
      ${ev.status!=='done'?countdown:'<div class="ei-countdown" style="color:var(--accent)">✓ 完了</div>'}
    </div>`;
  }).join('');
}
function markDone(id) {
  const ev = events.find(e=>e.id===id);
  if (!ev||ev.status==='done') return;
  if (confirm(`「${ev.company} ${ev.type}」を完了にしますか？`)) { ev.status='done'; saveEvents(); renderEvents(); }
}

function openEventDetail(id) {
  const ev = events.find(e=>e.id===id);
  if (!ev) return;
  document.getElementById('detail-company').textContent = ev.company;
  document.getElementById('detail-type').textContent = ev.type || 'その他';
  document.getElementById('detail-type').className = `type-badge type-${ev.type||'その他'}`;
  document.getElementById('detail-time').textContent = formatDatetime(ev.datetime);
  document.getElementById('detail-note').value = ev.note || '';
  document.getElementById('detail-detail').value = ev.detail || '';
  document.getElementById('detail-status').textContent = ev.status === 'done' ? '✓ 完了' : '進行中';
  document.getElementById('detail-status').style.color = ev.status === 'done' ? 'var(--accent)' : 'var(--text2)';
  document.getElementById('detail-done-btn').style.display = ev.status === 'done' ? 'none' : 'block';
  document.getElementById('event-detail-modal').dataset.id = id;
  document.getElementById('event-detail-modal').classList.add('open');
}
function saveEventDetail() {
  const id = parseInt(document.getElementById('event-detail-modal').dataset.id);
  const ev = events.find(e=>e.id===id);
  if (!ev) return;
  ev.note = document.getElementById('detail-note').value;
  ev.detail = document.getElementById('detail-detail').value;
  saveEvents(); renderEvents();
  document.getElementById('event-detail-modal').classList.remove('open');
}
function closeEventDetail() {
  document.getElementById('event-detail-modal').classList.remove('open');
}
function markDoneFromDetail() {
  const id = parseInt(document.getElementById('event-detail-modal').dataset.id);
  const ev = events.find(e=>e.id===id);
  if (!ev) return;
  ev.status = 'done'; saveEvents(); renderEvents();
  document.getElementById('event-detail-modal').classList.remove('open');
}

// ─── Calendar ─────────────────────────────────────────────
function changeMonth(dir) {
  calMonth += dir;
  if (calMonth>11){calMonth=0;calYear++;} if (calMonth<0){calMonth=11;calYear--;}
  renderCalendar();
}
function renderCalendar() {
  const months=['1月','2月','3月','4月','5月','6月','7月','8月','9月','10月','11月','12月'];
  document.getElementById('cal-title').textContent = `${calYear}年 ${months[calMonth]}`;
  const container = document.getElementById('cal-days');
  const today = new Date();
  const firstDay = new Date(calYear, calMonth, 1).getDay();
  const daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  const daysInPrev = new Date(calYear, calMonth, 0).getDate();
  let html = '';
  for (let i=firstDay-1;i>=0;i--) html+=`<div class="cal-day other-month"><div class="cal-day-num">${daysInPrev-i}</div></div>`;
  for (let d=1;d<=daysInMonth;d++) {
    const isToday = today.getFullYear()===calYear&&today.getMonth()===calMonth&&today.getDate()===d;
    const dayEvs = events.filter(ev=>{const dt=new Date(ev.datetime);return dt.getFullYear()===calYear&&dt.getMonth()===calMonth&&dt.getDate()===d&&ev.status!=='done';});
    const dots = dayEvs.slice(0,3).map(ev=>`<div class="cal-dot type-${ev.type||'その他'}" onclick="openEventDetail(${ev.id})" style="cursor:pointer">${ev.company}</div>`).join('');
    html+=`<div class="cal-day${isToday?' today':''}"><div class="cal-day-num">${d}</div>${dots}</div>`;
  }
  const remaining = 42-firstDay-daysInMonth;
  for (let i=1;i<=remaining;i++) html+=`<div class="cal-day other-month"><div class="cal-day-num">${i}</div></div>`;
  container.innerHTML = html;
}

// ─── Progress Board ───────────────────────────────────────
const BOARD_STAGES = ['気になる', 'ES提出', '説明会', '一次面接', '最終面接', '内定'];
function saveCompanies() { localStorage.setItem('shukatsu_companies', JSON.stringify(companies)); }
let draggedCompanyId = null;

function renderBoard() {
  const container = document.getElementById('board-container');
  container.innerHTML = BOARD_STAGES.map((stage, idx) => {
    const cards = companies.filter(c => c.stage === stage);
    const cardsHtml = cards.map(c => `
      <div class="board-card" draggable="true" data-id="${c.id}"
        ondragstart="boardDragStart(event, ${c.id})" ondragend="boardDragEnd(event)"
        onclick="editCompany(${c.id})">
        <div class="board-card-company">${c.name}</div>
        ${c.memo ? `<div class="board-card-meta">📝 ${c.memo.slice(0,30)}</div>` : ''}
      </div>`).join('');
    const addBox = idx === 0 ? `<div class="board-add"><input type="text" placeholder="＋ 会社を追加 (Enter)" onkeydown="addCompany(event)"></div>` : '';
    return `<div class="board-column">
      <div class="board-col-header">
        <span class="board-col-title">${stage}</span>
        <span class="board-col-count">${cards.length}</span>
      </div>
      <div class="board-col-body" data-stage="${stage}"
        ondragover="boardDragOver(event)" ondragleave="boardDragLeave(event)" ondrop="boardDrop(event, '${stage}')">
        ${cardsHtml}
      </div>
      ${addBox}
    </div>`;
  }).join('');
}
function addCompany(e) {
  if (e.key !== 'Enter') return;
  const name = e.target.value.trim();
  if (!name) return;
  companies.push({ id: Date.now(), name, stage: '気になる', memo: '' });
  saveCompanies(); renderBoard();
}
function editCompany(id) {
  const c = companies.find(c => c.id === id);
  if (!c) return;
  const memo = prompt(`「${c.name}」のメモ:`, c.memo || '');
  if (memo === null) {
    if (confirm(`「${c.name}」を削除しますか？`)) {
      companies = companies.filter(x => x.id !== id);
      saveCompanies(); renderBoard();
    }
    return;
  }
  c.memo = memo; saveCompanies(); renderBoard();
}
function boardDragStart(e, id) { draggedCompanyId = id; e.target.classList.add('dragging'); }
function boardDragEnd(e) { e.target.classList.remove('dragging'); }
function boardDragOver(e) { e.preventDefault(); e.currentTarget.classList.add('drag-over'); }
function boardDragLeave(e) { e.currentTarget.classList.remove('drag-over'); }
function boardDrop(e, stage) {
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  const c = companies.find(c => c.id === draggedCompanyId);
  if (c) { c.stage = stage; saveCompanies(); renderBoard(); }
}

// ─── Memo ─────────────────────────────────────────────────
function saveMemos() { localStorage.setItem('shukatsu_memos', JSON.stringify(memos)); }
function renderMemoList() {
  const memoCompanies = [...new Set(events.map(e=>e.company))];
  const sel = document.getElementById('memo-company-tag');
  sel.innerHTML = '<option value="">会社タグなし</option>' + memoCompanies.map(c=>`<option value="${c}">${c}</option>`).join('');
  const container = document.getElementById('memo-items');
  if (!memos.length) { container.innerHTML=`<div class="empty-state" style="padding:20px"><div class="empty-icon" style="font-size:24px">📝</div>メモがありません</div>`; return; }
  container.innerHTML = memos.sort((a,b)=>b.updatedAt-a.updatedAt).map(m=>`
    <div class="memo-item${currentMemoId===m.id?' active':''}" onclick="openMemo(${m.id})">
      <div class="memo-item-title">${m.title||'無題'}</div>
      ${m.company?`<div class="memo-item-date">🏢 ${m.company}</div>`:''}
      <div class="memo-item-preview">${(m.content||'').slice(0,40)||'内容なし'}</div>
    </div>`).join('');
}
function newMemo() {
  const m = { id: Date.now(), title: '', content: '', company: '', updatedAt: Date.now() };
  memos.unshift(m); saveMemos(); openMemo(m.id);
}
function openMemo(id) {
  currentMemoId = id;
  const m = memos.find(m=>m.id===id);
  if (!m) return;
  document.getElementById('memo-empty').style.display = 'none';
  document.getElementById('memo-edit-area').style.display = 'flex';
  document.getElementById('memo-title-input').value = m.title || '';
  document.getElementById('memo-content').value = m.content || '';
  document.getElementById('memo-company-tag').value = m.company || '';
  renderMemoList();
}
function saveMemo() {
  if (!currentMemoId) return;
  const m = memos.find(m=>m.id===currentMemoId);
  if (!m) return;
  m.title = document.getElementById('memo-title-input').value;
  m.content = document.getElementById('memo-content').value;
  m.company = document.getElementById('memo-company-tag').value;
  m.updatedAt = Date.now();
  saveMemos(); renderMemoList();
}
function deleteMemo() {
  if (!currentMemoId) return;
  if (!confirm('このメモを削除しますか？')) return;
  memos = memos.filter(m=>m.id!==currentMemoId);
  currentMemoId = null;
  saveMemos();
  document.getElementById('memo-empty').style.display = 'flex';
  document.getElementById('memo-edit-area').style.display = 'none';
  renderMemoList();
}

// ─── Auto refresh Google token ────────────────────────────
async function refreshGoogleToken() {
  if (!settings.gcalRefreshToken) return;
  try {
    const res = await fetch('/api/refresh-token', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ refresh_token: settings.gcalRefreshToken })
    });
    const data = await res.json();
    if (data.access_token) {
      settings.gcalToken = data.access_token;
      localStorage.setItem('shukatsu_settings', JSON.stringify(settings));
    }
  } catch(e) { console.error('Token refresh failed:', e); }
}
setInterval(refreshGoogleToken, 45 * 60 * 1000);
refreshGoogleToken();

// ─── Periodic reminder check ──────────────────────────────
function formatDatetime(dt) {
  if (!dt) return '日時未定';
  return new Date(dt).toLocaleString('ja-JP', { month:'long', day:'numeric', weekday:'short', hour:'2-digit', minute:'2-digit' });
}
function checkReminders() {
  const now = new Date();
  events.forEach(ev => {
    if (ev.status==='done'||ev.reminded) return;
    const diffH = (new Date(ev.datetime)-now)/3600000;
    if (diffH<=24&&diffH>0) { ev.reminded=true; saveEvents(); addMessage('assistant',`⏰ リマインダー: ${ev.company} の ${ev.type} が ${Math.round(diffH)}時間後です！\n${formatDatetime(ev.datetime)}`); }
  });
}
setInterval(checkReminders, 60000);
</script>
